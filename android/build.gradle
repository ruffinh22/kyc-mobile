buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "25.2.9519653"
        kotlinVersion = "1.8.0"
        hermesEnabled = true
        reactNativeVersion = "0.73.6"
    }
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.3.1")
        classpath("com.google.gms:google-services:4.4.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.10")
        classpath("com.facebook.react:react-native-gradle-plugin:0.73.6")
    }
}

allprojects {
    repositories {
        maven {
            url "$rootDir/../node_modules/expo-camera/android/maven"
        }
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
        maven { url 'https://jitpack.io' }
    }

    configurations.all {
        resolutionStrategy {
            force 'org.jitsi:webrtc:118.0.0'
        }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = '17'
                }
            }

            // Fix lazy : ne force jamais la création/résolution immédiate de la tâche.
            // Couvre toutes les tâches de lint release (generateReleaseLintModel,
            // lintVitalAnalyzeRelease, lintVitalRelease, etc.) car le nom exact varie
            // selon le module et la version d'AGP.
            project.tasks.matching { it.name.contains('Lint') && it.name.contains('Release') }.configureEach { lintTask ->
                lintTask.dependsOn(project.tasks.matching { it.name == 'copyReleaseExpoConfig' })
                lintTask.mustRunAfter(project.tasks.matching { it.name == 'copyReleaseExpoConfig' })
            }

            // lintVital ne doit pas faire échouer un build de release sur des modules
            // tiers (Expo) : on le désactive plutôt que de risquer un ordre de tâches
            // instable en CI/local.
            project.android.lint {
                checkReleaseBuilds = false
                abortOnError = false
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}